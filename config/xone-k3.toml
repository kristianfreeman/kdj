# kdj on an Allen & Heath Xone:K3 with its factory map (latching layers
# off, MIDI channel 15), split down the middle: the left two columns drive
# deck A, the right two deck B, the same layout on each side. With two kdj
# Pis on one network, the K3 plugs into either; each Pi takes a deck letter
# and the other half's controls (and LEDs) go across the network. Notes from
# the K3 user guide's "MIDI implementation default"; LEDs answer on the same
# notes (red; add 36 for amber, 72 for green with led_offset). A column's
# controls are the one to its left's plus 1, so deck B's are deck A's plus 2.
#
#   ┌───────── deck A ─────────┬───────── deck B ─────────┐
#   │ JOG          LOOP SIZE   │ JOG          LOOP SIZE   │ encoders
#   │ push: KEY    push: LOOP  │ push: KEY    push: LOOP  │
#   │ (pots: unused — the mixer does EQ)                  │
#   │ SYNC         MASTER      │ SYNC         MASTER      │ row 1
#   │ ◀ JUMP       JUMP ▶      │ ◀ JUMP       JUMP ▶      │ row 2
#   │ QUANTIZE     RANGE       │ QUANTIZE     RANGE       │ row 3
#   │ TEMPO        —           │ TEMPO        —           │ faders
#   │ HOT CUE A    B           │ HOT CUE A    B           │ grid 1
#   │ HOT CUE C    D           │ HOT CUE C    D           │ grid 2
#   │ ◀ NUDGE      NUDGE ▶     │ ◀ NUDGE      NUDGE ▶     │ grid 3
#   │ CUE          PLAY        │ CUE          PLAY        │ grid 4
#   │ encoder: browse,         │ SHIFT: BROWSE / BACK     │ bottom
#   │   push: open / load      │ encoder: browse,         │
#   │ LAYER: BROWSE / BACK     │   push: open / load      │
#   └──────────────────────────┴──────────────────────────┘

[midi]
port = "XONE:K3"
# Lit LEDs in red (0); 36 for amber, 72 for green.
led_offset = 0

# ═══ Deck A: columns 1–2 ═══

# --- Encoders (CC 0–1, two's complement; push notes 52–53).

[[midi.map]]
channel = 15
deck = 0
cc = 0
up = "JogForward"
down = "JogBack"

[[midi.map]]
channel = 15
deck = 0
note = 52
action = "KeyLock"

[[midi.map]]
channel = 15
deck = 0
cc = 1
up = "LoopDouble"
down = "LoopHalve"

[[midi.map]]
channel = 15
deck = 0
note = 53
action = "LoopToggle"

# --- Buttons under the pots: rows 1–3 (notes 48–49, 44–45, 40–41).

[[midi.map]]
channel = 15
deck = 0
note = 48
action = "Sync"

[[midi.map]]
channel = 15
deck = 0
note = 49
action = "Master"

[[midi.map]]
channel = 15
deck = 0
note = 44
action = "BeatJumpBack"

[[midi.map]]
channel = 15
deck = 0
note = 45
action = "BeatJumpForward"

[[midi.map]]
channel = 15
deck = 0
note = 40
action = "Quantize"

[[midi.map]]
channel = 15
deck = 0
note = 41
action = "TempoRange"

# --- Fader 1 (CC 16): tempo, soft takeover. Fader 2 (CC 17) unused.

[[midi.map]]
channel = 15
deck = 0
cc = 16
fader = "Tempo"

# --- Grid (notes 36–37, 32–33, 28–29, 24–25): hot cues, nudge, CUE and PLAY.

[[midi.map]]
channel = 15
deck = 0
note = 36
action = "HotCue1"

[[midi.map]]
channel = 15
deck = 0
note = 37
action = "HotCue2"

[[midi.map]]
channel = 15
deck = 0
note = 32
action = "HotCue3"

[[midi.map]]
channel = 15
deck = 0
note = 33
action = "HotCue4"

[[midi.map]]
channel = 15
deck = 0
note = 28
action = "NudgeBack"

[[midi.map]]
channel = 15
deck = 0
note = 29
action = "NudgeForward"

[[midi.map]]
channel = 15
deck = 0
note = 24
action = "Cue"

[[midi.map]]
channel = 15
deck = 0
note = 25
action = "PlayPause"

# --- Bottom left: encoder (CC 20, push 13) and LAYER (note 12).

[[midi.map]]
channel = 15
deck = 0
cc = 20
up = "BrowseDown"
down = "BrowseUp"

[[midi.map]]
channel = 15
deck = 0
note = 13
action = "BrowseLoad"

[[midi.map]]
channel = 15
deck = 0
note = 12
action = "BrowseBack"

# ═══ Deck B: columns 3–4, deck A's notes and CCs plus 2 ═══

[[midi.map]]
channel = 15
deck = 1
cc = 2
up = "JogForward"
down = "JogBack"

[[midi.map]]
channel = 15
deck = 1
note = 54
action = "KeyLock"

[[midi.map]]
