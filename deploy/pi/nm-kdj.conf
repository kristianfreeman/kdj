# kdj: two Pis on a cable straight between them (no router, so no DHCP)
# still reach each other: when DHCP gives a connection no IPv4 address, it
# gets a link-local one (169.254.x.y) instead. On a network with a router
# this changes nothing. 4 is "fallback" (NetworkManager 1.52 and later).
[connection]
ipv4.link-local=4
