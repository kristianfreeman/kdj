# kdj: Pis on a switch, or a cable straight between them, with no router
# (so no DHCP) still reach each other: when DHCP gives a connection no IPv4
# address, it gets a link-local one (169.254.x.y) instead. 4 is "fallback"
# (NetworkManager 1.52 and later). DHCP never gives up: by default it fails
# the connection after 45 s and starts again, dropping that address each
# time; this way it keeps it, and still takes a lease if a router turns up.
# On a network with a router this changes nothing.
[connection]
ipv4.link-local=4
ipv4.dhcp-timeout=2147483647
