[package]
name = "deck-sim"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
anyhow = "1.0.104"
deck-engine = { version = "0.1.0", path = "../deck-engine" }
deck-library = { version = "0.1.0", path = "../deck-library" }
deck-ui = { version = "0.1.0", path = "../deck-ui" }
glow = "0.18.0"
hdrhistogram = "7.6.0"
hound = "3.5.1"
libc = "0.2.190"
png = "0.18.1"
sdl2 = { version = "0.38.0", features = ["use-pkgconfig"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.7"

[lints]
workspace = true
