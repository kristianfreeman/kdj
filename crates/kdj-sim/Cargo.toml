[package]
name = "kdj-sim"
version = "0.2.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
anyhow = "1.0.104"
kdj-engine = { version = "0.2.0", path = "../kdj-engine" }
kdj-library = { version = "0.2.0", path = "../kdj-library" }
kdj-ui = { version = "0.2.0", path = "../kdj-ui" }
glow = "0.18.0"
hdrhistogram = "7.6.0"
hound = "3.5.1"
libc = "0.2.190"
png = "0.18.1"
sdl2 = { version = "0.38.0", features = ["use-pkgconfig"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.7"

[lints]
workspace = true
