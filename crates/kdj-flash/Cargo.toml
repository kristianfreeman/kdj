[package]
name = "kdj-flash"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
description = "Put the deck's image on an SD card: list cards, show what's on them, format, flash and verify"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
indicatif = "0.18.6"
libc = "0.2.190"
liblzma = "0.4.8"
plist = "1.10.1"
serde_json = "1.0.151"
sha2 = "0.11.0"

[lints]
workspace = true
