[package]
name = "kdj"
version = "0.2.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
anyhow = "1.0.104"
assert_no_alloc = "1.1.2"
cpal = "0.18.2"
kdj-engine = { version = "0.2.0", path = "../kdj-engine" }
kdj-library = { version = "0.2.0", path = "../kdj-library" }
kdj-ui = { version = "0.2.0", path = "../kdj-ui" }
glow = "0.18.0"
midir = "0.11.0"
rtrb = "0.4.0"
rusty_link = { version = "0.4.9", optional = true }
sdl2 = { version = "0.38.0", features = ["use-pkgconfig"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
toml = "1.1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[lints]
workspace = true

[features]
default = ["link"]
# Ableton Link (GPL-2.0-or-later; needs cmake and libclang to build).
link = ["dep:rusty_link"]
