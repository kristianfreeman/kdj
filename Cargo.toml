[workspace]
resolver = "3"
members = ["crates/kdj-engine", "crates/kdj-ui", "crates/kdj", "crates/kdj-sim", "crates/kdj-library", "crates/kdj-flash"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
# Everything Clippy has an opinion on, denied, plus picks from `restriction`.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
str_to_string = "deny"
rc_buffer = "deny"
same_name_method = "deny"
self_named_module_files = "deny"
verbose_file_reads = "deny"
lossy_float_literal = "deny"
float_cmp_const = "deny"
# Noise without value here: module-prefixed names read fine in this codebase.
module_name_repetitions = "allow"

[profile.dev]
# DSP in debug builds is unusably slow; optimise deps and our code a bit.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
