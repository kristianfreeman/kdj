<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>deck storybook</title><style>:root{color-scheme:dark}body{margin:0;background:#050505;color:#eee;font:15px/1.45 system-ui,sans-serif}header{padding:20px 24px 4px}h1{font-size:20px;margin:0}header p{color:#999;margin:4px 0 0}nav{position:sticky;top:0;background:#050505ee;padding:10px 24px;display:flex;gap:16px;z-index:1;border-bottom:1px solid #222}nav a{color:#ccc;text-decoration:none}nav a:hover{color:#fff}h2{font-size:16px;margin:28px 24px 12px;color:#ccc;font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:20px;padding:0 24px 24px}figure{margin:0}figure img{width:100%;display:block;border-radius:6px;border:1px solid #2a2a2a}figcaption{margin-top:8px}figcaption b{display:block;font-weight:600}figcaption span{color:#999;font-size:14px}</style></head><body><header><h1>deck storybook</h1><p>800×480 screens rendered by the real UI code. Regenerate: <code>cargo run --release -p kdj-sim -- story</code></p></header><nav><a href='#deck'>Deck</a><a href='#browser'>Browser</a><a href='#settings'>Settings</a><a href='#mapping'>Mapping</a></nav><h2 id='deck'>Deck</h2><div class=grid><figure><a href='deck-no-track.png'><img src='deck-no-track.png' alt='No track' loading=lazy></a><figcaption><b>No track</b><span>First start: tapping anywhere opens the browser.</span></figcaption></figure><figure><a href='deck-stopped-at-the-cue.png'><img src='deck-stopped-at-the-cue.png' alt='Stopped at the cue' loading=lazy></a><figcaption><b>Stopped at the cue</b><span>Paused, parked on the cue: CUE lit, play outlined.</span></figcaption></figure><figure><a href='deck-playing.png'><img src='deck-playing.png' alt='Playing' loading=lazy></a><figcaption><b>Playing</b><span>Auto grid (no Rekordbox analysis), key lock and quantize on.</span></figcaption></figure><figure><a href='deck-loop-4-beats.png'><img src='deck-loop-4-beats.png' alt='Loop, 4 beats' loading=lazy></a><figcaption><b>Loop, 4 beats</b><span>Hatched on both waveforms, bracketed; 4 and LOOP filled.</span></figcaption></figure><figure><a href='deck-hot-cues-a-and-b.png'><img src='deck-hot-cues-a-and-b.png' alt='Hot cues A and B' loading=lazy></a><figcaption><b>Hot cues A and B</b><span>Flags on the detail waveform, ticks on the overview.</span></figcaption></figure><figure><a href='deck-6-on-16-key-lock-off.png'><img src='deck-6-on-16-key-lock-off.png' alt='+6% on ±16, key lock off' loading=lazy></a><figcaption><b>+6% on ±16, key lock off</b><span>KEY outlined; the range badge reads ±16.</span></figcaption></figure><figure><a href='deck-sync-to-link.png'><img src='deck-sync-to-link.png' alt='SYNC to Link' loading=lazy></a><figcaption><b>SYNC to Link</b><span>Following a 136 BPM session with one peer: locked, the meter at zero.</span></figcaption></figure><figure><a href='deck-master-on-link.png'><img src='deck-master-on-link.png' alt='MASTER on Link' loading=lazy></a><figcaption><b>MASTER on Link</b><span>This deck sets the session's tempo for two peers.</span></figcaption></figure><figure><a href='deck-alone-on-link-not-synced.png'><img src='deck-alone-on-link-not-synced.png' alt='Alone on Link, not synced' loading=lazy></a><figcaption><b>Alone on Link, not synced</b><span>The phase meter reads against the session.</span></figcaption></figure><figure><a href='deck-a-track-from-deck-b-s-stick.png'><img src='deck-a-track-from-deck-b-s-stick.png' alt='A track from deck B's stick' loading=lazy></a><figcaption><b>A track from deck B's stick</b><span>Loaded across the network; it plays from memory.</span></figcaption></figure><figure><a href='deck-lending-this-stick.png'><img src='deck-lending-this-stick.png' alt='Lending this stick' loading=lazy></a><figcaption><b>Lending this stick</b><span>Deck B has a track from the stick in this kdj: bright, not dim.</span></figcaption></figure><figure><a href='deck-tempo-fader-catching-up.png'><img src='deck-tempo-fader-catching-up.png' alt='Tempo fader catching up' loading=lazy></a><figcaption><b>Tempo fader catching up</b><span>Hollow: where the hardware fader is; solid: the tempo.</span></figcaption></figure><figure><a href='deck-last-30-seconds.png'><img src='deck-last-30-seconds.png' alt='Last 30 seconds' loading=lazy></a><figcaption><b>Last 30 seconds</b><span>Time remaining flashes inverted on the beat.</span></figcaption></figure><figure><a href='deck-loading.png'><img src='deck-loading.png' alt='Loading' loading=lazy></a><figcaption><b>Loading</b><span>Status bottom right while the next track loads.</span></figcaption></figure><figure><a href='deck-long-title-long-error.png'><img src='deck-long-title-long-error.png' alt='Long title, long error' loading=lazy></a><figcaption><b>Long title, long error</b><span>Both cut short, never off screen.</span></figcaption></figure><figure><a href='deck-two-decks.png'><img src='deck-two-decks.png' alt='Two decks' loading=lazy></a><figcaption><b>Two decks</b><span>The software beatmatching harness: A has the keyboard; phase meters read each other.</span></figcaption></figure></div><h2 id='browser'>Browser</h2><div class=grid><figure><a href='browser-sources.png'><img src='browser-sources.png' alt='Sources' loading=lazy></a><figcaption><b>Sources</b><span>Two sticks plugged in.</span></figcaption></figure><figure><a href='browser-a-stick-s-top-level.png'><img src='browser-a-stick-s-top-level.png' alt='A stick's top level' loading=lazy></a><figcaption><b>A stick's top level</b><span>All tracks, then its playlist folders.</span></figcaption></figure><figure><a href='browser-playlist-folder.png'><img src='browser-playlist-folder.png' alt='Playlist folder' loading=lazy></a><figcaption><b>Playlist folder</b><span>Tracks found on the stick, and how many are missing.</span></figcaption></figure><figure><a href='browser-track-list.png'><img src='browser-track-list.png' alt='Track list' loading=lazy></a><figcaption><b>Track list</b><span>All tracks: the loaded one is marked, the highlight filled.</span></figcaption></figure><figure><a href='browser-empty-playlist.png'><img src='browser-empty-playlist.png' alt='Empty playlist' loading=lazy></a><figcaption><b>Empty playlist</b><span>Says so instead of a blank screen.</span></figcaption></figure><figure><a href='browser-deep-path.png'><img src='browser-deep-path.png' alt='Deep path' loading=lazy></a><figcaption><b>Deep path</b><span>The path is trimmed from the left.</span></figcaption></figure><figure><a href='browser-reading-the-library.png'><img src='browser-reading-the-library.png' alt='Reading the library' loading=lazy></a><figcaption><b>Reading the library</b><span>Right after start, or a stick going in.</span></figcaption></figure><figure><a href='browser-nothing-to-browse.png'><img src='browser-nothing-to-browse.png' alt='Nothing to browse' loading=lazy></a><figcaption><b>Nothing to browse</b><span>No collection, no stick.</span></figcaption></figure></div><h2 id='settings'>Settings</h2><div class=grid><figure><a href='settings-choosing-a-page.png'><img src='settings-choosing-a-page.png' alt='Choosing a page' loading=lazy></a><figcaption><b>Choosing a page</b><span>Arrows move through the pages; the current one is filled.</span></figcaption></figure><figure><a href='settings-playback-changing-a-setting.png'><img src='settings-playback-changing-a-setting.png' alt='Playback: changing a setting' loading=lazy></a><figcaption><b>Playback: changing a setting</b><span>In the rows: the page is outlined, the row highlighted, help below.</span></figcaption></figure><figure><a href='settings-audio.png'><img src='settings-audio.png' alt='Audio' loading=lazy></a><figcaption><b>Audio</b><span>Buffer sizes with their latency at the output's rate.</span></figcaption></figure><figure><a href='settings-sync.png'><img src='settings-sync.png' alt='Sync' loading=lazy></a><figcaption><b>Sync</b><span>Ableton Link, how SYNC lines up, and this deck's letter.</span></figcaption></figure><figure><a href='settings-network.png'><img src='settings-network.png' alt='Network' loading=lazy></a><figcaption><b>Network</b><span>Wi-Fi on or off, its network and address, and Ethernet's.</span></figcaption></figure><figure><a href='settings-controller.png'><img src='settings-controller.png' alt='Controller' loading=lazy></a><figcaption><b>Controller</b><span>LED colour for the K3, the mapping drawn, and MIDI learn.</span></figcaption></figure><figure><a href='settings-display.png'><img src='settings-display.png' alt='Display' loading=lazy></a><figcaption><b>Display</b><span>Zoom, phase meter, perf overlay.</span></figcaption></figure><figure><a href='settings-system.png'><img src='settings-system.png' alt='System' loading=lazy></a><figcaption><b>System</b><span>Version and library rescan.</span></figcaption></figure></div><h2 id='mapping'>Mapping</h2><div class=grid><figure><a href='mapping-xone-k3.png'><img src='mapping-xone-k3.png' alt='Xone:K3' loading=lazy></a><figcaption><b>Xone:K3</b><span>config/xone-k3.toml: deck A's columns filled, deck B's outlined; unused pots and faders faint.</span></figcaption></figure><figure><a href='mapping-focused-deck.png'><img src='mapping-focused-deck.png' alt='Focused deck' loading=lazy></a><figcaption><b>Focused deck</b><span>config/midi-example.toml on the K3: no deck given, so they follow the focused deck (dark fill).</span></figcaption></figure><figure><a href='mapping-unknown-controller.png'><img src='mapping-unknown-controller.png' alt='Unknown controller' loading=lazy></a><figcaption><b>Unknown controller</b><span>No drawing for its port: the bindings as a table.</span></figcaption></figure><figure><a href='mapping-no-mapping.png'><img src='mapping-no-mapping.png' alt='No mapping' loading=lazy></a><figcaption><b>No mapping</b><span>Started without --midi.</span></figcaption></figure></div></body></html>
