<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kdj enclosure</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #eef0f3; color: #111418; font: 15px/1.45 system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 12px; left: 12px; background: #ffffffee; border: 1px solid #c9ced6; border-radius: 10px; padding: 12px 14px; display: grid; gap: 9px; min-width: 250px; box-shadow: 0 2px 10px #0000001a; }
  #ui b { font-size: 16px; }
  #ui label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  #ui input[type=range] { flex: 1; }
  #ui input[type=checkbox] { width: 17px; height: 17px; }
  #size, #stamp { color: #444b55; }
  .hit { color: #8b0000; font-weight: 700; }
  .hit::before { content: "✕ "; }
  .ok { color: #0b4a1e; font-weight: 700; }
  .ok::before { content: "✓ "; }
  button { background: #f3f4f6; color: #111418; border: 1px solid #aeb5bf; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #e2e5e9; }
</style>
</head>
<body>
<div id="ui">
  <b>kdj enclosure · slab</b>
  <span id="size">loading…</span>
  <label>Explode <input id="explode" type="range" min="0" max="80" value="0"></label>
  <label><input id="showLid" type="checkbox" checked> Lid</label>
  <label><input id="showBase" type="checkbox" checked> Base</label>
  <label><input id="showGhosts" type="checkbox" checked> Pi, DAC, screen, ribbon</label>
  <label><input id="xray" type="checkbox"> X-ray the box</label>
  <div style="display:flex; gap:6px"><button id="front">Front</button><button id="back">Back</button><button id="top">Top</button><button id="iso">3/4</button></div>
  <div id="hits"></div>
  <span id="stamp"></span>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef0f3);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 1, 5000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f98, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.position.set(150, -200, 300);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 1.2);
fill.position.set(-200, 150, 100);
scene.add(fill);
const grid = new THREE.GridHelper(400, 40, 0xa9b0ba, 0xd3d7dd);
grid.rotation.x = Math.PI / 2;
scene.add(grid);

// The build123d model (cad/kdj.py) writes live/parts.json and a GLB per
// group (coloured), live/report.json, and live/collisions.glb when parts
// overlap. Z up, mm.
const gltf = new GLTFLoader();
const groups = {};   // name -> { obj, printed }
let collisions = null;
let center = new THREE.Vector3(), radius = 120, first = true;

function prep(obj, printed) {
  obj.traverse((o) => {
    if (!o.isMesh) return;
    // Exported materials come in metallic, which renders near black with no
    // environment to reflect: make them matte.
    if ('metalness' in o.material) { o.material.metalness = 0; o.material.roughness = 0.75; }
    o.userData.base = o.material.clone();
  });
  obj.userData.printed = printed;
  // build123d writes glTF in metres, turned Y up; the scene is mm, Z up.
  obj.rotation.x = Math.PI / 2;
  obj.scale.setScalar(1000);
  return obj;
}

async function load(stamp) {
  const manifest = await (await fetch(`live/parts.json?${stamp}`, { cache: 'no-store' })).json();
  const box = new THREE.Box3();
  for (const part of manifest) {
    const g = await gltf.loadAsync(`live/${part.file}?${stamp}`);
    if (groups[part.name]) scene.remove(groups[part.name].obj);
    const obj = prep(g.scene, part.printed);
    groups[part.name] = { obj, printed: part.printed };
    scene.add(obj);
    box.expandByObject(obj);
  }
  if (collisions) { scene.remove(collisions); collisions = null; }
  try {
    const c = await gltf.loadAsync(`live/collisions.glb?${stamp}`);
    collisions = prep(c.scene, false);
    collisions.traverse((o) => { if (o.isMesh) o.material = new THREE.MeshBasicMaterial({ color: 0xff2d2d, depthTest: false, transparent: true, opacity: 0.85 }); });
    collisions.renderOrder = 10;
    scene.add(collisions);
  } catch (e) { /* none */ }
  const report = await (await fetch(`live/report.json?${stamp}`, { cache: 'no-store' })).json();
  const [w, d, h] = report.size_mm;
  document.getElementById('size').textContent = `${w} × ${d} × ${h} mm · built in ${report.seconds} s`;
  const list = document.getElementById('hits');
  list.innerHTML = '';
  if (!report.collisions.length) list.innerHTML = '<span class="ok">No collisions</span>';
  for (const c of report.collisions) {
    const li = document.createElement('div');
    li.className = 'hit';
    li.textContent = c.error ? `${c.a} × ${c.b}: couldn't check` : `${c.a} × ${c.b}: ${c.mm3} mm³`;
    list.appendChild(li);
  }
  if (!box.isEmpty()) {
    box.getCenter(center);
    const s = box.getSize(new THREE.Vector3());
    radius = Math.max(s.x, s.y, s.z);
    if (first) { view('iso'); first = false; }
  }
  apply();
  document.getElementById('stamp').textContent = 'updated ' + new Date().toLocaleTimeString();
}

function apply() {
  const ex = +document.getElementById('explode').value;
  const xray = document.getElementById('xray').checked;
  for (const [name, g] of Object.entries(groups)) {
    const o = g.obj;
    o.position.set(0, 0, name === 'lid' ? ex : name === 'screen' ? ex * 0.92 : name === 'ribbon' ? ex * 0.3 : 0);
    o.visible = name === 'base' ? showBase.checked : name === 'lid' ? showLid.checked : showGhosts.checked;
    o.traverse((m) => {
      if (!m.isMesh) return;
      const mat = m.userData.base.clone();
      if (xray && g.printed) { mat.transparent = true; mat.opacity = 0.25; mat.depthWrite = false; }
      mat.side = THREE.DoubleSide;
      m.material = mat;
    });
  }
}

function view(which) {
  const d = radius * 2.2;
  const dirs = { front: [0, -1, 0.35], back: [0, 1, 0.35], top: [0, -0.001, 1], iso: [0.9, -1.1, 0.9] };
  const v = new THREE.Vector3(...dirs[which]).normalize().multiplyScalar(d);
  camera.position.copy(center).add(v);
  controls.target.copy(center);
  controls.update();
}

for (const id of ['explode', 'showLid', 'showBase', 'showGhosts', 'xray']) document.getElementById(id).addEventListener('input', apply);
for (const id of ['front', 'back', 'top', 'iso']) document.getElementById(id).addEventListener('click', () => view(id));
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// Reload the parts when the watcher re-exports them; the camera stays put.
let seen = null;
async function poll() {
  try {
    const s = (await (await fetch('live/stamp.txt', { cache: 'no-store' })).text()).trim();
    if (s !== seen) { seen = s; await load(s); }
  } catch (e) {}
  setTimeout(poll, 700);
}
poll();
(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
</body>
</html>
