name = "tempo: steps, range, key lock, nudge, reset"
duration = 8.0

[synth]
bpm = 134.0
bars = 32
intro_bars = 0
lead_in = 0.0

[[step]]
at = 0.1
key = "Space"

# +1%, +2%, then one fine step down at the ±8 resolution (0.02%).
[[step]]
at = 1.0
key = "PageUp"
[[step]]
at = 1.1
key = "PageUp"
[[step]]
at = 1.2
key = "Down"
# Beats so far: (0.9 + 0.1·1.01 + 0.1·1.02 + 0.3·1.0198) s × 134/60 = 3.1466
[[expect]]
at = 1.5
tempo_pct = 1.98
beat = 3.1466
beat_tol = 0.01

# Switching to ±16 snaps to that range's 0.05% resolution.
[[step]]
at = 2.0
key = "T"
[[expect]]
at = 2.1
tempo_pct = 2.0

[[step]]
at = 3.0
key = "K"
[[expect]]
at = 3.1
keylock = false
playing = true

# Hold nudge forward for a second, then reset tempo.
[[step]]
at = 4.0
key = "Right"
hold = 1.0
[[step]]
at = 6.0
key = "R"
[[expect]]
at = 6.1
tempo_pct = 0.0
playing = true
